name: web-auto-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  smoke-and-cases:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test/web_auto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test/web_auto/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare env
        run: cp .env.web-auto.example .env.web-auto

      - name: Run smoke suite
        run: npm run test:smoke
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          WEB_USERNAME: ${{ secrets.WEB_USERNAME }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          LOGIN_MODE: ${{ secrets.LOGIN_MODE }}
          STORAGE_STATE_PATH: .auth/storage-state.json

      - name: Run case suite
        run: npm run test:cases
        env:
          WEB_BASE_URL: ${{ secrets.WEB_BASE_URL }}
          WEB_USERNAME: ${{ secrets.WEB_USERNAME }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
          LOGIN_MODE: ${{ secrets.LOGIN_MODE }}
          STORAGE_STATE_PATH: .auth/storage-state.json

      - name: Upload playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/web_auto/playwright-report
          if-no-files-found: ignore

      - name: Notify on failure (optional webhook)
        if: failure() && secrets.WEB_AUTO_ALERT_WEBHOOK != ''
        run: |
          curl -X POST "${{ secrets.WEB_AUTO_ALERT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"web-auto-e2e 执行失败，请检查 GitHub Actions 与 Playwright 报告。"}'
