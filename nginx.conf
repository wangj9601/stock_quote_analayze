# 生产 nginx 模板；运维可复制到 <NginxHome>\conf\nginx.conf。与 docs/prod/nginx.conf 同步维护。
# =============================================================================
# 手工进程部署（DeployRoot\current + release.ps1 -ManualProcessDeploy）
#   nginx 反代的是本机端口，与「运行目录是否为 current」无关；但必须与后台进程监听端口一致：
#   upstream backend_api      -> 127.0.0.1:5000   start_backend_api（默认 BACKEND_PORT/.env）
#   upstream frontend_server  -> 127.0.0.1:8000 start_frontend.py（生产请在 .env 固定端口，勿仅用递增找口）
#   upstream admin_server     -> 127.0.0.1:8001 current\admin\dist 上 python -m http.server（与 release -ManualAdminHttpPort）
# 下列 ssl_certificate 路径须为服务器上真实文件（常需随 DeployRoot 调整）。
# release.ps1 -ManualProcessDeploy -NginxHome 时会在 nginx -t 前校验 upstream 端口与证书是否存在。
# =============================================================================
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # 上游服务器配置
    upstream backend_api {
        server 127.0.0.1:5000;
    }

    upstream frontend_server {
        server 127.0.0.1:8000;
    }

    upstream admin_server {
        server 127.0.0.1:8001;
    }

    # HTTP：必须先放行 ACME，再整站跳转 HTTPS（否则 Let's Encrypt HTTP-01 永远命中 return，证书无法续期）
    server {
        listen       80;
        server_name  www.icemaplecity.com icemaplecity.com;

        location /.well-known/acme-challenge/ {
            root html;
            try_files $uri =404;
            access_log logs/acme_access.log;
            error_log logs/acme_error.log debug;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS服务器配置
    server {
        listen       443 ssl;
        http2 on;
        server_name  www.icemaplecity.com icemaplecity.com;

        ssl_certificate      C:/work/stock_quote_analayze/tools/nginx/ssl/www.icemaplecity.com-chain.pem;
        ssl_certificate_key  C:/work/stock_quote_analayze/tools/nginx/ssl/www.icemaplecity.com-key.pem;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers  ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers  on;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;


	# 禁止目录遍历
	location ~ /\.\./ {
	    deny all;
	    return 403;
	}

	# 允许浏览器与常见 REST 方法（含 DELETE/OPTIONS，避免管理端与 /api 被误拦 405）
	if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
	    return 405;
	}

	# 隐藏服务器信息
	server_tokens off;

        # API代理
        location /api/ {

	    client_max_body_size 20m;

            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            
            # CORS处理
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }
            
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        }

        # 管理端静态资源（CSS、JS、图片等）
        # ^~ 优先于正则 location，避免被其它规则抢走；proxy_intercept_errors off 确保 chunk 真 404，不误走 SPA 回退成 index.html（否则动态导入会得到 HTML，控制台即 Failed to fetch dynamically imported module）
        location ^~ /admin/assets/ {
            proxy_pass http://admin_server/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors off;

            # 静态资源缓存（带 hash 的文件名）
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 管理端favicon
        location = /admin/favicon.ico {
            proxy_pass http://admin_server/favicon.ico;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 管理端（Vite base=/admin/）：反代 8001，strip /admin 前缀；深链刷新依赖上游 404 后回退 index.html
        location /admin/ {
            proxy_pass http://admin_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            proxy_intercept_errors on;
            error_page 404 = @admin_fallback;

            access_log logs/admin_access.log;
            error_log logs/admin_error.log;
        }

        # 管理端 SPA：显式请求 /index.html（勿依赖无效自定义头；避免内部重定向后 URI 仍带 /admin 导致上游继续 404）
        location @admin_fallback {
            rewrite ^ /index.html break;
            proxy_pass http://admin_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # 壳页面勿长期缓存，否则发布后用户仍可能持有旧 index，引用的 chunk 哈希已在磁盘删除 → 动态导入 404；新开标签有时拿到较新文档故表现为「新窗口正常、页内点击异常」
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }

        
	# 前端静态资源
        location ~ ^/assets/ {
            proxy_pass http://frontend_server$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 前端favicon
        location = /favicon.ico {
            proxy_pass http://frontend_server/favicon.ico;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 网站前端 SPA（8000）
        location / {
            proxy_pass http://frontend_server/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            proxy_intercept_errors on;
            error_page 404 = @frontend_fallback;
        }

        location @frontend_fallback {
            rewrite ^ /index.html break;
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # 健康检查端点
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 禁止访问隐藏文件（但允许 .well-known）
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        # ACME挑战路径
        location /.well-known/acme-challenge/ {
            root html;
            try_files $uri =404;
            access_log logs/acme_access.log;
            error_log logs/acme_error.log debug;
        }
    }
}
