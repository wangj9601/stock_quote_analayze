# Alembic configuration - stock_quote_analayze
#
# NOTE: keep this file ASCII-only.
# alembic 1.13.x reads alembic.ini with the *system locale* encoding (GBK on a
# zh-CN Windows box). Non-ASCII comments therefore break parsing on Windows.
# Detailed Chinese documentation lives in:
#   - docs/database/Alembic_guide.md   (team-facing guide)
#   - alembic/env.py                   (design notes, UTF-8 Python source)
#
# The database URL is NOT stored here on purpose. alembic/env.py injects it from
# backend_api.config.DATABASE_CONFIG, which reads .env
# (DATABASE_URL or DB_HOST/DB_PORT/DB_NAME/DB_USER/DB_PASSWORD).
# You may override it ad-hoc with:  alembic -x db_url=postgresql+psycopg2://... upgrade head
#
# Quick reference (a wrapper with drift preview also exists: scripts/db_migrate.py):
#   alembic current                 # show current revision
#   alembic upgrade head            # apply all pending revisions
#   alembic revision --autogenerate -m "message"
#   alembic stamp 0001_baseline     # mark an existing database, no DDL executed

[alembic]
script_location = alembic

# Make project packages importable from migration scripts (backend_api.*, backend_core.*)
prepend_sys_path = .

# Revision file naming: date-time prefix keeps files in chronological order
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Placeholder only - overwritten by env.py at runtime
sqlalchemy.url =

# Post-write hooks (currently disabled)
[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
