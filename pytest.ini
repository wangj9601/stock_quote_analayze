[tool:pytest]
# pytest配置文件

# 测试目录
testpaths = test

# 测试文件模式
python_files = test_*.py *_test.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 添加选项
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# 最小版本要求
minversion = 6.0

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    property: 属性测试
    slow: 慢速测试
    data: 数据相关测试

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning