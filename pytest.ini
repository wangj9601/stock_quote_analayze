[pytest]
# pytest 配置（标准段名为 [pytest]）
#
# 默认排除直接依赖 akshare / tushare 或 AkShare 采集器联网的脚本，
# 避免 pytest 全量收集时误跑外部行情接口。需要单独验证时使用：
#   pytest test/test_akshare_solutions.py -v

# 测试目录
testpaths = test

# 测试文件模式
python_files = test_*.py *_test.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 添加选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --ignore=test/test.py
    --ignore=test/test_akshare_solutions.py
    --ignore=test/test_enhanced_akshare_simple.py
    --ignore=test/test_enhanced_akshare_collector.py
    --ignore=test/test_stock_individual_info_em_print.py
    --ignore=test/test_stock_individual_spot_xq_print.py
    --ignore=test/test_hk_hist_volume_unit.py
    --ignore=test/test.stock_individual_info_em.py
    --ignore=test/test_update_stock_basic_info_market.py
    --ignore=test/test_yfinance.py
    --ignore=test/test_proxy_config.py
    --ignore=test/test_stock_shares_excel_parse.py
    --ignore=test/test_etf_kdj_hlc_fallback.py

# 最小版本要求
minversion = 6.0

# 标记
markers =
    unit: 单元测试
    integration: 集成测试
    property: 属性测试
    slow: 慢速测试
    data: 数据相关测试

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
