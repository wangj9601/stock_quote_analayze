<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} html,body{margin:0;height:900px;overflow:hidden}
body{font-family:"Noto Sans SC",sans-serif;background:#f4f7f2;color:#1c241c;display:grid;grid-template-columns:220px 1fr}
nav{background:#2f4a34;color:#f4f7f2;padding:16px}
.brand{font-weight:700;letter-spacing:.14em}
a{display:block;color:#f4f7f2;text-decoration:none;font-size:13px;padding:7px 0}
main{padding:16px 20px}
.course{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid #6b2d8b;padding:10px 12px;margin-bottom:12px}
.n{width:22px;height:22px;border:2px solid #6b2d8b;border-radius:50%;display:grid;place-items:center;color:#6b2d8b;font-weight:700;font-size:12px}
.line{flex:1;height:2px;background:#6b2d8b}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:#fff;border:1px solid #c5d0c2;padding:12px;font-size:13px}
</style></head><body>
<nav><div class="brand">冰枫堂</div><p style="font-size:12px;opacity:.8">管理端</p>
<a>今日看板</a><a>策略推荐</a><a style="background:#6b2d8b">GMS 策略版本</a><a>行情采集</a><a>用户与日志</a>
</nav>
<main>
  <div class="course"><span class="n">1</span>复盘未完成<div class="line"></div><span class="n">2</span>GMS 未保存<div class="line"></div><span class="n">3</span>采集失败 1</div>
  <div class="panels">
    <div class="p"><b>GMS 策略版本</b><p>default · 观察股 128 · 参数有未保存修改</p></div>
    <div class="p"><b>下一站</b><p>采-行情：日线任务失败，10:02</p></div>
  </div>
</main>
</body></html>
