<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} html,body{margin:0;height:900px;overflow:hidden}
body{font-family:"Noto Sans SC",sans-serif;background:#fff;color:#111;
background-image:linear-gradient(#d6e4f5 1px,transparent 1px),linear-gradient(90deg,#d6e4f5 1px,transparent 1px);
background-size:40px 40px;display:grid;grid-template-columns:240px 1fr}
nav{background:#0b3d91;color:#fff;padding:16px}
a{display:block;color:#fff;text-decoration:none;padding:8px;font-size:14px}
a.on{background:#ff5a1f}
main{padding:20px}
h1{margin:0 0 12px;font-size:32px;letter-spacing:.04em}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:2px solid #111}
.cell{min-height:120px;padding:12px;border-right:1px solid #111;border-bottom:1px solid #111;background:rgba(255,255,255,.86);font-size:14px}
</style></head><body>
<nav><b style="letter-spacing:.16em">冰枫堂</b>
<a>今日</a><a class="on">策略 · GMS</a><a>采集</a><a>审计</a></nav>
<main>
  <h1>GMS 策略版本</h1>
  <div class="row">
    <div class="cell">今日<br>复盘未完成 2</div>
    <div class="cell">策略<br>default / gms_penalty</div>
    <div class="cell">采集<br>失败 1</div>
  </div>
</main>
</body></html>
