<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>通道突破 — 历史追溯</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/design-tokens.css?v=20261017-w400-600">
    <link rel="stylesheet" href="css/ops-shell.css">
    <link rel="stylesheet" href="css/ops-data.css?v=20261008b">
    <link rel="stylesheet" href="css/ops-responsive.css">
    <link rel="stylesheet" href="css/workbench-ops.css">

    <link rel="stylesheet" href="css/screening.css">
    <link rel="stylesheet" href="css/stock_gms_trace.css">
    <link rel="stylesheet" href="css/ops-surfaces.css?v=20261008c">
</head>
<body class="ops-map">
    <script src="components/header.js"></script>
    <script>loadHeader('screening');</script>
    <main class="container">
        <section class="gms-trace-card" aria-labelledby="csbTraceTitle">
            <h1 id="csbTraceTitle" class="gms-trace-title">通道突破 · 历史追溯</h1>
            <p class="gms-backtest-hint">
                按日期区间查看单股信号。已有预计算直接读出，缺的交易日按当日 K 线补算并写入记录。
                跨度上限 180 天、最多 120 个交易日。要整段覆盖重算，用「强制重新计算」。
            </p>
            <form class="toolbar" id="csbTraceForm">
                <div class="toolbar-row">
                    <label for="stockCode">股票代码
                        <input type="text" id="stockCode" class="csb-trace-code" name="code" placeholder="603200" autocomplete="off" inputmode="numeric" maxlength="6" spellcheck="false">
                    </label>
                    <p class="csb-trace-name-line">名称 <strong id="stockDisplay">--</strong></p>
                    <label for="startDate">开始日期
                        <input type="date" id="startDate" name="start">
                    </label>
                    <label for="endDate">结束日期
                        <input type="date" id="endDate" name="end">
                    </label>
                    <label for="configSelect">参数版本
                        <select id="configSelect" name="config_id"></select>
                    </label>
                    <label class="csb-trace-check" for="entryOnly">
                        <input type="checkbox" id="entryOnly" name="entry_only"> 仅入场
                    </label>
                </div>
                <div class="toolbar-row csb-trace-actions">
                    <button id="searchBtn" type="submit">查询</button>
                    <button id="forceComputeBtn" class="btn-secondary" type="button">强制重新计算</button>
                </div>
            </form>
            <div id="forceComputeProgress" class="gms-trace-recompute-status" role="status" aria-live="polite" hidden></div>
            <p id="metaMsg" class="gms-meta-text" aria-live="polite"></p>
            <p id="loadingMsg" class="loading-msg" role="status" hidden>正在读取预计算，缺口交易日会补算…</p>
            <p id="emptyMsg" class="empty-msg" role="status" hidden>暂无信号记录</p>
            <div class="table-wrapper">
                <table class="trace-table csb-trace-table" id="traceTable">
                    <caption class="csb-trace-caption">通道突破历史信号</caption>
                    <thead>
                        <tr>
                            <th scope="col">日期</th>
                            <th scope="col">信号类型</th>
                            <th scope="col">SETUP</th>
                            <th scope="col">入场</th>
                            <th scope="col">得分</th>
                            <th scope="col">收盘</th>
                            <th scope="col">通道下轨</th>
                            <th scope="col">通道上轨</th>
                            <th scope="col">粘合天数</th>
                            <th scope="col">回踩次数</th>
                            <th scope="col">入场下沿</th>
                            <th scope="col">来源</th>
                            <th scope="col">操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <nav class="pagination" aria-label="信号分页">
                <button type="button" id="firstPage">第一页</button>
                <button type="button" id="prevPage">上一页</button>
                <span id="pageInfo"></span>
                <button type="button" id="nextPage">下一页</button>
                <button type="button" id="lastPage">最后一页</button>
            </nav>
        </section>
    </main>
    <script src="js/config.js"></script>
    <script src="js/csb_score_detail.js?v=20261007-csb"></script>
    <script src="js/stock_csb_trace.js?v=20261019-config"></script>
</body>
</html>
