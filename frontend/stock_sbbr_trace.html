<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>做小做底 — 策略信号历史</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/screening.css">
    <link rel="stylesheet" href="css/stock_gms_trace.css">
</head>
<body>
    <script src="components/header.js"></script>
    <script>loadHeader('quotes');</script>
    <div class="container">
        <div class="gms-trace-card">
            <div class="gms-trace-title">做小做底（SBBR）— 策略信号历史</div>
            <p class="gms-backtest-hint" style="margin:8px 0 12px;">
                默认按日期区间对该股<strong>按日 asof 现算回溯</strong>（仅用 ≤ 当日 K 线）；也可切换「仅读预计算」查看日终落库记录。跨度上限 180 自然日。
            </p>
            <div class="toolbar">
                <div class="toolbar-row">
                    <label>股票: <span id="stockDisplay">--</span></label>
                    <label>开始日期: <input type="date" id="startDate"></label>
                    <label>结束日期: <input type="date" id="endDate"></label>
                    <label>参数版本:
                        <select id="configSelect"></select>
                    </label>
                    <label title="live=按日现算；trace=只读 sbbr_signal_trace">数据源:
                        <select id="sourceSelect">
                            <option value="live" selected>现算回溯</option>
                            <option value="trace">仅读预计算</option>
                        </select>
                    </label>
                    <label><input type="checkbox" id="entryOnly"> 仅入场</label>
                    <label><input type="checkbox" id="requireBottom"> 仅筑底</label>
                    <button id="searchBtn" type="button">查询</button>
                </div>
            </div>
            <div id="metaMsg" class="gms-meta-text" style="margin:6px 0;"></div>
            <div id="loadingMsg" class="loading-msg" style="display:none;">加载中...</div>
            <div id="emptyMsg" class="empty-msg" style="display:none;">暂无信号记录</div>
            <div class="table-wrapper">
                <table class="trace-table" id="traceTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>做小</th>
                            <th>筑底</th>
                            <th>入场</th>
                            <th>模式</th>
                            <th>收盘</th>
                            <th>MA20</th>
                            <th>箱体支撑</th>
                            <th>箱体阻力</th>
                            <th>KDE支撑</th>
                            <th>KDE阻力</th>
                            <th>防守下沿</th>
                            <th>量比</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <button type="button" id="firstPage">第一页</button>
                <button type="button" id="prevPage">上一页</button>
                <span id="pageInfo"></span>
                <button type="button" id="nextPage">下一页</button>
                <button type="button" id="lastPage">最后一页</button>
            </div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/sbbr_score_detail.js"></script>
    <script src="js/stock_sbbr_trace.js"></script>
</body>
</html>
