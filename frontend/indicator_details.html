<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>股票指标详情</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/design-tokens.css?v=20260925q">
    <link rel="stylesheet" href="css/ops-shell.css">
    <link rel="stylesheet" href="css/ops-data.css?v=20260925q">
    <link rel="stylesheet" href="css/ops-responsive.css">
    <link rel="stylesheet" href="css/workbench-ops.css">

    <link rel="stylesheet" href="css/stock.css">
    <style>
        .indicator-workbench .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
        .indicator-workbench .card-content { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .indicator-workbench .card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--color-border); }
        .indicator-workbench .data-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed rgba(217, 226, 236, 0.12); }
        .indicator-workbench .loading,
        .indicator-workbench .error { text-align: center; padding: 2rem 1rem; }
    </style>
    <link rel="stylesheet" href="css/ops-surfaces.css?v=20260925q">
</head>

<body class="ops-map indicator-page indicator-workbench" data-channel="analyze">
    <div class="container indicator-workbench">
        <div class="header">
            <h1>指标详情数据</h1>
            <div class="stock-info" id="stockInfo">加载中...</div>
        </div>

        <div id="loading" class="loading">正在加载数据...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div class="indicator-grid" id="indicatorGrid" style="display: none;">
            <!-- MA -->
            <div class="indicator-card">
                <div class="card-title">MA 移动平均线</div>
                <div class="card-content" id="maContent"></div>
            </div>

            <!-- MACD -->
            <div class="indicator-card">
                <div class="card-title">MACD 指数平滑异同移动平均线</div>
                <div class="card-content" id="macdContent"></div>
            </div>

            <!-- KDJ -->
            <div class="indicator-card">
                <div class="card-title">KDJ 随机指标</div>
                <div class="card-content" id="kdjContent"></div>
            </div>

            <!-- RSI -->
            <div class="indicator-card">
                <div class="card-title">RSI 相对强弱指标</div>
                <div class="card-content" id="rsiContent"></div>
            </div>

            <!-- BOLL -->
            <div class="indicator-card">
                <div class="card-title">BOLL 布林带</div>
                <div class="card-content" id="bollContent"></div>
            </div>

            <!-- MAVOL -->
            <div class="indicator-card">
                <div class="card-title">MAVOL 成交量均线</div>
                <div class="card-content" id="mavolContent"></div>
            </div>

            <!-- PVFRS -->
            <div class="indicator-card" style="grid-column: 1 / -1;">
                <div class="card-title">PVFRS 均值频率共振指标</div>
                <div class="card-content" id="pvfrsContent"
                    style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));"></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/indicator_details.js"></script>
</body>

</html>
