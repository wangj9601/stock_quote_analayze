<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URT 策略信号历史</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/screening.css">
    <link rel="stylesheet" href="css/stock_gms_trace.css">
</head>
<body>
    <script src="components/header.js"></script>
    <script>loadHeader('quotes');</script>
    <div class="container">
        <div class="gms-trace-card">
            <div class="gms-trace-title">URT 上升趋势 — 策略信号历史</div>
            <div class="toolbar">
                <div class="toolbar-row">
                    <label>股票: <span id="stockDisplay">--</span></label>
                    <label>开始日期: <input type="date" id="startDate"></label>
                    <label>结束日期: <input type="date" id="endDate"></label>
                    <label>参数版本:
                        <select id="configSelect"></select>
                    </label>
                    <span id="urtConfigAlignHint" class="param-hint" style="display:none;color:#b45309;"></span>
                    <span id="urtTraceStaleHint" class="param-hint" style="display:none;color:#b45309;"></span>
                    <button id="searchBtn">查询</button>
                    <button id="forceComputeBtn" class="btn-secondary" type="button">强制重新计算</button>
                    <a id="detailLink" class="gms-op-btn" href="#" target="_blank" rel="noopener">打开明细页</a>
                </div>
            </div>
            <div id="forceComputeProgress" class="gms-trace-recompute-status" style="display:none;"></div>
            <div id="loadingMsg" class="loading-msg" style="display:none;">加载中...</div>
            <div id="emptyMsg" class="empty-msg" style="display:none;">暂无 URT 预计算信号（可点击「强制重新计算」对该股即时计算）</div>
            <div class="table-wrapper">
                <table class="trace-table urt-trace-table" id="traceTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>买点</th>
                            <th>得分</th>
                            <th>收盘</th>
                            <th>MA20</th>
                            <th>4日阳</th>
                            <th>5日阳</th>
                            <th>量能倍数</th>
                            <th>量比</th>
                            <th>换手%</th>
                            <th>支撑</th>
                            <th>阻力</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <button type="button" id="firstPage">第一页</button>
                <button type="button" id="prevPage">上一页</button>
                <span id="pageInfo"></span>
                <button type="button" id="nextPage">下一页</button>
                <button type="button" id="lastPage">最后一页</button>
            </div>
        </div>

        <div class="gms-trace-card gms-backtest-wrap">
            <div class="gms-trace-title">单股回测</div>
            <p class="gms-backtest-hint">与<strong>管理端 → URT 回测管理</strong>规则一致：使用上方日期区间，对当前股票发起命中率回测；完成后可查看摘要并导出明细。</p>
            <div class="gms-backtest-toolbar">
                <label>目标涨幅(%):
                    <input type="number" id="btTargetPctMin" class="gms-backtest-input-num" min="0.1" max="100" step="0.5" value="10" />
                    ～
                    <input type="number" id="btTargetPctMax" class="gms-backtest-input-num" min="0.1" max="100" step="0.5" value="10" />
                </label>
                <label>持有窗口(日):
                    <input type="number" id="btHorizon" class="gms-backtest-input-num" min="10" max="30" value="10" />
                </label>
                <label>最低得分:
                    <input type="number" id="btMinScore" class="gms-backtest-input-num" min="0" max="100" step="5" placeholder="默认" />
                </label>
            </div>
            <div class="gms-backtest-actions">
                <button type="button" id="btStartBtn">开始回测</button>
            </div>
            <div id="btStatusArea" class="gms-backtest-status" style="display:none;"></div>
            <div id="btResultArea" class="gms-backtest-result" style="display:none;"></div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/urt_score_detail.js"></script>
    <script src="js/stock_urt_trace.js"></script>
</body>
</html>
