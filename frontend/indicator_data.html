<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>股票指标数据</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/design-tokens.css?v=20260925q">
    <link rel="stylesheet" href="css/ops-shell.css">
    <link rel="stylesheet" href="css/ops-data.css?v=20260925q">
    <link rel="stylesheet" href="css/ops-responsive.css">
    <link rel="stylesheet" href="css/workbench-ops.css">

    <link rel="stylesheet" href="css/stock.css">
    <style>
        .indicator-workbench .container { max-width: 100%; margin: 0 auto; padding: 0 16px; }
        .indicator-workbench .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .indicator-workbench .data-table th,
        .indicator-workbench .data-table td { padding: 8px; text-align: center; }
        .indicator-workbench .data-table th { position: sticky; top: 0; z-index: 10; font-weight: 600; }
        .indicator-workbench .content-area { overflow-x: auto; }
        .indicator-workbench .loading,
        .indicator-workbench .error,
        .indicator-workbench .no-data { text-align: center; padding: 2rem 1rem; }
        .indicator-workbench .tab { cursor: pointer; font-size: 0.9rem; }
    </style>
    <link rel="stylesheet" href="css/ops-surfaces.css?v=20260925q">
</head>

<body class="ops-map indicator-page indicator-workbench" data-channel="analyze">
    <div class="container indicator-workbench">
        <div class="header">
            <h1>指标数据查询</h1>
            <div class="stock-info" id="stockInfo">加载中...</div>
        </div>

        <div id="loading" class="loading">正在加载数据...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="mainContent" style="display: none;">
            <div class="tabs" id="tabs">
                <div class="tab active" data-tab="ma">MA 移动平均线</div>
                <div class="tab" data-tab="macd">MACD</div>
                <div class="tab" data-tab="kdj">KDJ</div>
                <div class="tab" data-tab="rsi">RSI</div>
                <div class="tab" data-tab="boll">BOLL</div>
                <div class="tab" data-tab="mavol">MAVOL</div>
                <div class="tab" data-tab="pvfrs">PVFRS 共振指标</div>
            </div>

            <div class="content-area">
                <div class="tab-content" id="maContent"></div>
                <div class="tab-content" id="macdContent" style="display: none;"></div>
                <div class="tab-content" id="kdjContent" style="display: none;"></div>
                <div class="tab-content" id="rsiContent" style="display: none;"></div>
                <div class="tab-content" id="bollContent" style="display: none;"></div>
                <div class="tab-content" id="mavolContent" style="display: none;"></div>
                <div class="tab-content" id="pvfrsContent" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/indicator_data.js"></script>
</body>

</html>
