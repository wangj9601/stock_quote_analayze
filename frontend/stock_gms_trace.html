<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMS 信号追溯</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/stock.css">
    <link rel="stylesheet" href="css/screening.css">
    <link rel="stylesheet" href="css/stock_gms_trace.css">
</head>

<body>
    <script src="components/header.js"></script>
    <script>loadHeader('quotes');</script>

    <div class="container">
        <div class="gms-trace-card">
            <div class="gms-trace-title">GMS 信号追溯记录</div>
            <div class="toolbar">
                <div class="toolbar-row">
                    <label>股票: <span id="stockDisplay">--</span></label>
                    <label>开始日期: <input type="date" id="startDate"></label>
                    <label>结束日期: <input type="date" id="endDate"></label>
                    <button id="searchBtn">查询</button>
                    <button id="forceComputeBtn" class="btn-secondary">强制重新计算</button>
                </div>
            </div>
            <div id="gmsTraceConfigTabs" class="gms-trace-config-tabs" style="display:none;"></div>
            <div id="forceComputeProgress" class="gms-trace-recompute-status" style="display:none;"></div>
            <div id="loadingMsg" class="loading-msg" style="display:none;">正在计算信号追溯，请稍候...</div>
            <div id="emptyMsg" class="empty-msg" style="display:none;">该股票暂无 GMS 指标数据</div>
            <div class="table-wrapper">
                <table class="trace-table" id="traceTable">
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>总分</th>
                            <th>信号强度</th>
                            <th>买点类型</th>
                            <th>支撑</th>
                            <th>阻力</th>
                            <th>均值收敛态</th>
                            <th>动量溢出态</th>
                            <th>Δ</th>
                            <th>d</th>
                            <th>Δ/d₂₀</th>
                            <th>Δ/d₁</th>
                            <th>F/Z</th>
                            <th>量比</th>
                            <th>得分明细</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="pagination">
                <button id="firstPage">第一页</button>
                <button id="prevPage">上一页</button>
                <span id="pageInfo"></span>
                <button id="nextPage">下一页</button>
                <button id="lastPage">最后一页</button>
            </div>
        </div>

        <div class="gms-trace-card gms-backtest-wrap">
            <div class="gms-trace-title">策略回测（单股）</div>
            <p class="gms-backtest-hint">与<strong>管理端 → GMS 回测管理</strong>中任务规则一致：区间内按<strong>全部交易日</strong>扫描（非本表分页）；样本为 GMS <strong>左/右侧买点</strong>，并受<strong>最低总分</strong>筛选。完成后可查看报告并导出明细 CSV（code 列为文本格式）。</p>
            <div class="gms-backtest-toolbar">
                <label>市场
                    <select id="btMarket" class="gms-backtest-select">
                        <option value="all">A股+ETF+港股</option>
                        <option value="cn">A股</option>
                        <option value="etf">ETF</option>
                        <option value="hk">港股</option>
                    </select>
                </label>
                <label class="gms-bt-target-label">目标阈值(%)
                    <select id="btTargetPctQuick" class="gms-backtest-select gms-bt-target-quick" title="快捷选择常用涨幅">
                        <option value="">快捷</option>
                        <option value="3">+3%</option>
                        <option value="5">+5%</option>
                        <option value="10" selected>+10%</option>
                    </select>
                    <input type="number" id="btTargetPct" class="gms-backtest-input-num gms-bt-target-pct-input" min="0.1" max="100" step="0.5" value="10" title="输入数字为涨幅百分比，如 10 表示 +10%" />
                </label>
                <label>持有窗口(日)
                    <input type="number" id="btHorizon" class="gms-backtest-input-num" min="10" max="30" value="20" />
                </label>
                <label>最低总分
                    <input type="number" id="btMinScore" class="gms-backtest-input-num" min="0" max="100" step="5" value="70" />
                </label>
            </div>
            <div class="gms-backtest-actions">
                <button type="button" id="btStartBtn">开始回测</button>
                <button type="button" id="btCancelBtn" class="btn-secondary" disabled>取消任务</button>
            </div>
            <div id="btStatusArea" class="gms-backtest-status" style="display:none;"></div>
            <div id="btResultArea" class="gms-backtest-result" style="display:none;"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/gms_score_detail.js"></script>
    <script src="js/stock_gms_trace.js"></script>

    <footer class="icp-footer">
        <div class="icp-container">
            <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">京ICP备18061239号-1</a>
        </div>
    </footer>
</body>

</html>
