<div id="low-nine-content" class="strategy-content" style="display:none;">
            <div class="strategy-info-card">
                <h2>策略说明</h2>
                <ul class="strategy-conditions">
                    <li><strong>股票范围:</strong>全部A股（排除ST股票）</li>
                    <li><strong>时间范围:</strong>最近13个交易日</li>
                    <li><strong>选股条件:</strong></li>
                    <li class="condition-item">应用于下跌趋势中，连续 9 根K线（或交易日），每一天的收盘价都低于它前面第4天的收盘价</li>
                    <li class="condition-item">自动排除所有ST股票（包括ST、*ST、S*ST等）</li>
                </ul>
            </div>

            <div class="screening-actions">
                <button id="refreshBtn-low-nine" class="refresh-btn" data-strategy="low-nine">刷新筛选</button>
                <button id="exportBtn-low-nine" class="export-btn" style="display:none;">导出CSV</button>
                <span id="searchDate-low-nine" class="search-date"></span>
            </div>

            <div id="loadingIndicator-low-nine" class="loading-indicator" style="display:none;">
                <div class="spinner"></div>
                <span>正在筛选股票，请稍候...</span>
            </div>

            <div id="errorMessage-low-nine" class="error-message" style="display:none;"></div>

            <div id="resultsContainer-low-nine" class="results-container">
                <div class="results-header">
                    <span id="resultsCount-low-nine" class="results-count">共找到 0 只符合条件的股票</span>
                </div>
                <div id="resultsTable-low-nine" class="results-table-wrapper">
                    <table class="results-table">
                        <thead>
                            <tr>
                                <th>股票代码</th>
                                <th>股票名称</th>
                                <th>形态开始日期</th>
                                <th>形态结束日期</th>
                                <th>形态开始价格</th>
                                <th>9天跌幅</th>
                                <th>9天最高价</th>
                                <th>9天最低价</th>
                                <th>当前价格</th>
                                <th>当前涨跌幅</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody-low-nine">
                            <tr>
                                <td colspan="11" class="empty-state">点击"刷新筛选"按钮开始筛选</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
